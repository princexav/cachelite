[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cachelite"
version = "0.1.0"
authors = [
  { name="Kimberly Washington", email="hiokeke26@gmail.com" },
]
description = "Fast, thread-safe in-memory key-value cache with Write-Ahead Logging (WAL) and TTL."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
cachelite = "cachelite.cli:main"
